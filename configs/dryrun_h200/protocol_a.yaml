protocol: A
description: "[H200 settings] Lightweight protocol: ITS (indoor) -> SOTS-indoor in-domain, RTTS unsupervised, NH-HAZE zero-shot test"

paths:
  reside_root: data/RESIDE
  its_train: data/RESIDE/ITS           # RESIDE indoor training set (13,990 imgs)
  sots_indoor: data/RESIDE/SOTS/indoor # 500 imgs
  rtts: data/RESIDE/RTTS               # 4,322 unlabeled real hazy imgs
  nh_haze: data/NH-HAZE                # 55 pairs; only official 5-image test split used
  checkpoints: checkpoints/dryrun_h200/protocol_a
  results: results/dryrun_h200/protocol_a

data:
  crop_size: 256
  batch_size: 4
  num_workers: 1          # run_h200.sh lowers this if the machine has fewer CPU cores

model:
  backbone: hazeshiftnet       # custom encoder + 3 heads (src/model.py), base=48, 13.5M params
  base: 48
  n_res: 3
  pretrained_checkpoint: null  # trained from scratch: DehazeFormer weights don't map onto this architecture
  uncertainty: true
  ema_teacher: true
  ema_decay: 0.999

stage1:
  max_steps_per_epoch: 3
  epochs: 2   # H200 equal step budgets at batch 32: A 30 x 437 = 13,110 steps; B 70 x 187 = 13,090 steps
  val_max_images: 2   # all 500 SOTS images every epoch (cheap on H200)
  lr: 3.0e-4   # batch 16 -> 32: sqrt scaling of the T4 lr (2e-4)
  optimizer: adamw
  scheduler: cosine
  loss_weights:
    l1: 1.0
    ssim: 0.5
    perceptual: 0.1
    physical_consistency: 0.1

stage2:
  max_steps_per_epoch: 3
  epochs: 2   # 15 x 135 = 2,025 steps on RTTS at batch 32
  lr: 7.0e-5   # sqrt scaling of the T4 lr (5e-5)
  optimizer: adamw
  loss_weights:
    uncertainty_consistency: 1.0
    dark_channel_prior: 0.1
    bright_channel_prior: 0.05
    tv_transmission: 0.01
    ema_distillation: 0.2

eval:
  nh_haze_split: official_test   # 5 images only, per course decision
  report_full_nh_haze_niqe: true # secondary, no-reference, steadier stat over all 55
  metrics: [psnr, ssim, lpips, niqe]
  rtts_niqe_max_images: 2
  sots_max_images: 2   # NIQE on first 1,000 of 4,322 RTTS images (time budget)

seed: 42
amp: true
amp_dtype: bfloat16   # H200: bf16 autocast, no GradScaler needed
channels_last: true
